  .legend-item.dimmed{opacity:.25}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .legend-label{color:#c0c0c8;line-height:1.3}

// ── Build map ──
const map = L.map('map', {
  center: [20, 15],
  zoom: 2.5,
  minZoom: 2,
  maxZoom: 18,
  zoomControl: false,
  worldCopyJump: true
});

L.control.zoom({ position: 'topright' }).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

// ── Create markers by category ──
const catLayers = {};
const catCounts = {};

DATA.forEach(([name, cat, lat, lng]) => {
  if (!catLayers[cat]) {
    catLayers[cat] = L.layerGroup().addTo(map);
    catCounts[cat] = 0;
  }
  catCounts[cat]++;

  const color = CAT_COLORS[cat] || '#6c8aff';
  const marker = L.circleMarker([lat, lng], {
    radius: 5,
    fillColor: color,
    color: '#fff',
    weight: .6,
    opacity: .8,
    fillOpacity: .85
  });

  const shortCat = cat.replace(/^\d+\)\s*/, '');
  marker.bindPopup(`<b>${name}</b><div class="pop-cat">${shortCat}</div>`);
  marker.on('mouseover', function(){ this.setRadius(9); this.openPopup(); });
  marker.on('mouseout',  function(){ this.setRadius(5); this.closePopup(); });
  marker.addTo(catLayers[cat]);
});

// ── Legend ──
const legend = document.getElementById('legend');
const visState = {};

Object.keys(CAT_COLORS).forEach(cat => {
  if (!catLayers[cat]) return;
  visState[cat] = true;

  const row = document.createElement('div');
  row.className = 'legend-item';

  const dot = document.createElement('span');
  dot.className = 'legend-dot';
  dot.style.background = CAT_COLORS[cat];

  const label = document.createElement('span');
  label.className = 'legend-label';
  label.textContent = cat.replace(/^\d+\)\s*/, '');

  const count = document.createElement('span');
  count.className = 'legend-count';
  count.textContent = catCounts[cat] || 0;

  row.appendChild(dot);
  row.appendChild(label);
  row.appendChild(count);
  legend.appendChild(row);

  row.addEventListener('click', () => {
    visState[cat] = !visState[cat];
    if (visState[cat]) {
      map.addLayer(catLayers[cat]);
      row.classList.remove('dimmed');
    } else {
      map.removeLayer(catLayers[cat]);
      row.classList.add('dimmed');
    }
    updateCount();
  });
});

function updateCount() {
  let n = 0;
  Object.keys(visState).forEach(cat => { if (visState[cat]) n += (catCounts[cat]||0); });
  document.getElementById('visCount').textContent = n;
}
